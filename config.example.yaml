bot:
  name: YuukoBot
  prefix: "!"          # prefixo dos comandos
  environment: "development"

database:
  driver: sqlite3
  dsn: "file:storage/storage.db?_foreign_keys=on"

log:
  level: debug         # debug | info | warn | error

usersJID:
  owner: "seu_jid@lid" # JID do dono do bot (aparece no log ao iniciar)
  admins: []           # JIDs adicionais com permissão de admin

apiUrls:
  geocoding: "https://geocoding-api.open-meteo.com/v1/search"
  weather: "https://api.open-meteo.com/v1/forecast"

football:
  enabled: false
  api_key: "SUA_API_KEY_AQUI"  # Obtenha em https://api-football.com/
  notify_jid: "SEU_JID_AQUI@lid" # JID do grupo ou pessoa para receber notificações
  poll:
    idle_interval: "6h"   # modo idle: busca jogos da Copa 2026 a cada 6h (GET /fixtures?league=1&season=2026)
    live_interval: "60s"  # modo live: 60s free tier (1 call/min); 15s se plano pago
  watched_teams:
    - name: "Brasil"
      api_team_id: 0   # 0 = auto-detect via GET /teams?league=1&season=2026&search=Brazil
      flag: "🇧🇷"